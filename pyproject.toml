[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "decision-intelligence"
version = "0.2.0"
description = "Evidence-driven decision intelligence platform (Cognee + LangGraph + FastAPI)"
requires-python = ">=3.11,<3.14"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "python-dotenv>=1.0",
    "httpx>=0.27",
    "langgraph>=0.2",
    "openai>=1.40",
    "pypdf>=4.2",
]

[project.optional-dependencies]
cognee = ["cognee>=1.5,<2"]
# OpenRouter serves no embeddings endpoint; this enables local embedding so
# Cognee ingestion does not require OpenAI quota.
local-embeddings = ["cognee[fastembed]>=1.5,<2"]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.5",
]

[project.scripts]
decision-intel = "app.cli:main"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
